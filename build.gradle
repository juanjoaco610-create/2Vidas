plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.0.0'
group = 'com.geoda1'
base { archivesName = 'geoda1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { geoda1 { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { geoda1 { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes 'Implementation-Title': 'geoda1', 'Implementation-Version': project.version } }
